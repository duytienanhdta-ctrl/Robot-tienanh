<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Tiến Anh - Trợ Lý Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="bg-black flex flex-col items-center justify-between h-screen text-white select-none">

    <!-- Thanh trạng thái và Cài đặt API -->
    <header class="w-full flex justify-between items-center px-6 py-4 z-10 bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-3">
            <span id="status-dot" class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-pulse"></span>
            <span id="status-text" class="text-sm font-medium tracking-wide text-cyan-300">Sẵn sàng</span>
        </div>
        <button id="btn-config" class="px-3.5 py-1.5 rounded-lg border border-neutral-700 bg-neutral-900/80 hover:bg-neutral-800 text-xs text-neutral-300 transition">
            Cài đặt API Key
        </button>
    </header>

    <!-- Khu vực Canvas hiển thị khuôn mặt robot -->
    <main class="flex-1 w-full flex items-center justify-center relative cursor-pointer" id="main-area">
        <canvas id="robotCanvas"></canvas>
        
        <!-- Nút bấm bắt đầu trò chuyện -->
        <div id="start-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/95 z-30">
            <button id="btn-start" type="button" class="px-8 py-4 rounded-full bg-cyan-500 hover:bg-cyan-400 active:scale-90 text-black font-bold text-base shadow-[0_0_35px_rgba(6,182,212,0.8)] transition-all">
                Bắt đầu trò chuyện với Tiến Anh
            </button>
            <p class="mt-4 text-xs text-neutral-400 text-center px-4">Chạm để mở khóa âm thanh cho bé Tiến Anh</p>
        </div>
    </main>

    <!-- Bảng hiển thị nội dung đối thoại -->
    <footer class="w-full max-w-2xl px-6 py-3 z-10 bg-gradient-to-t from-black to-transparent flex flex-col gap-1 text-center">
        <p id="user-sub" class="text-sm text-neutral-400 min-h-[1.5rem] italic"></p>
        <p id="bot-sub" class="text-base font-medium text-cyan-300 min-h-[1.75rem]"></p>
        <p class="text-[11px] text-neutral-500">Chạm vào màn hình để bắt đầu nói câu tiếp theo</p>
    </footer>

    <script>
        // --- 1. CẤU HÌNH & TRẠNG THÁI ---
        let apiKey = localStorage.getItem("gemini_api_key") || "";
        let isTalking = false;
        let isThinking = false;
        let robotState = "NORMAL";
        let recognition = null;
        let silenceTimer = null;
        let speakTimeout = null;

        const canvas = document.getElementById("robotCanvas");
        const ctx = canvas.getContext("2d");

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const userSub = document.getElementById("user-sub");
        const botSub = document.getElementById("bot-sub");
        const btnConfig = document.getElementById("btn-config");
        const btnStart = document.getElementById("btn-start");
        const startOverlay = document.getElementById("start-overlay");
        const mainArea = document.getElementById("main-area");

        // --- 2. KÍCH THƯỚC CANVAS ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.70;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // --- 3. VẼ KHUÔN MẶT ROBOT ---
        let blinkProgress = 1.0;
        let isClosing = true;
        let isBlinking = false;
        let animTimer = 0.0;
        let mouthHeight = 4.0;

        function setRobotState(state) {
            robotState = state;
            if (state === "THINKING") {
                statusDot.className = "w-3.5 h-3.5 rounded-full bg-amber-400 animate-pulse";
                statusText.className = "text-sm font-medium tracking-wide text-amber-300";
                statusText.innerText = "Tiến Anh đang suy nghĩ...";
            } else if (state === "SPEAKING") {
                statusDot.className = "w-3.5 h-3.5 rounded-full bg-emerald-400 animate-pulse";
                statusText.className = "text-sm font-medium tracking-wide text-emerald-300";
                statusText.innerText = "Tiến Anh đang trả lời...";
            } else {
                statusDot.className = "w-3.5 h-3.5 rounded-full bg-cyan-400 animate-pulse";
                statusText.className = "text-sm font-medium tracking-wide text-cyan-300";
                statusText.innerText = "Đang lắng nghe bố nói...";
            }
        }

        setInterval(() => {
            if (robotState === "NORMAL" && !isBlinking && Math.random() < 0.6) {
                isBlinking = true;
                blinkProgress = 1.0;
                isClosing = true;
            }
        }, 3500);

        function drawFace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            animTimer += 0.016;

            if (isBlinking) {
                if (isClosing) {
                    blinkProgress -= 0.15;
                    if (blinkProgress <= 0.08) {
                        blinkProgress = 0.08;
                        isClosing = false;
                    }
                } else {
                    blinkProgress += 0.15;
                    if (blinkProgress >= 1.0) {
                        blinkProgress = 1.0;
                        isBlinking = false;
                    }
                }
            }

            if (robotState === "SPEAKING") {
                mouthHeight = 16.0 + 14.0 * Math.sin(animTimer * 18.0);
            } else {
                mouthHeight = 4.0;
            }

            let mainColor = "#00d8f6";
            if (robotState === "THINKING") mainColor = "#f59e0b";
            if (robotState === "SPEAKING") mainColor = "#10b981";

            const eyeW = Math.min(w * 0.22, 130);
            const eyeBaseH = Math.min(h * 0.42, 180);
            const eyeH = eyeBaseH * blinkProgress;
            const gap = Math.min(w * 0.14, 90);
            const radius = eyeW * 0.35;

            const eyeY = cy - (eyeH / 2) - 10;
            const leftEyeX = cx - eyeW - (gap / 2);
            const rightEyeX = cx + (gap / 2);

            // TAI VỂNH LÊN TRÊN
            ctx.save();
            ctx.strokeStyle = mainColor;
            ctx.fillStyle = (robotState === "SPEAKING") ? "rgba(16, 185, 129, 0.25)" : "rgba(0, 216, 246, 0.25)";
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 15;

            const earSpan = (robotState === "NORMAL") ? 45 : 22; 
            const earHeight = (robotState === "NORMAL") ? 40 : 18;

            // Tai trái
            const leftEarBaseX = leftEyeX;
            const leftEarBaseY = cy - 10;
            ctx.beginPath();
            ctx.moveTo(leftEarBaseX, leftEarBaseY - 35);
            ctx.lineTo(leftEarBaseX - earSpan, leftEarBaseY - earHeight);
            ctx.lineTo(leftEarBaseX, leftEarBaseY + 25);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(leftEarBaseX - earSpan, leftEarBaseY - earHeight, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Tai phải
            const rightEarBaseX = rightEyeX + eyeW;
            const rightEarBaseY = cy - 10;
            ctx.fillStyle = (robotState === "SPEAKING") ? "rgba(16, 185, 129, 0.25)" : "rgba(0, 216, 246, 0.25)";
            ctx.beginPath();
            ctx.moveTo(rightEarBaseX, rightEarBaseY - 35);
            ctx.lineTo(rightEarBaseX + earSpan, rightEarBaseY - earHeight);
            ctx.lineTo(rightEarBaseX, rightEarBaseY + 25);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(rightEarBaseX + earSpan, rightEarBaseY - earHeight, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.restore();

            // MẮT
            ctx.fillStyle = mainColor;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 20;

            function drawRoundedRect(x, y, width, height, r) {
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, r);
                ctx.fill();
            }

            drawRoundedRect(leftEyeX, eyeY, eyeW, eyeH, radius);
            drawRoundedRect(rightEyeX, eyeY, eyeW, eyeH, radius);
            ctx.shadowBlur = 0;

            // MIỆNG
            const mouthW = eyeW * 1.5;
            const mouthX = cx - (mouthW / 2);
            const mouthY = cy + (eyeBaseH / 2) + 25;

            ctx.fillStyle = mainColor;
            ctx.shadowColor = mainColor;
            ctx.shadowBlur = 15;
            drawRoundedRect(mouthX, mouthY - mouthHeight / 2, mouthW, Math.max(mouthHeight, 5), mouthW * 0.25);
            ctx.shadowBlur = 0;

            requestAnimationFrame(drawFace);
        }
        requestAnimationFrame(drawFace);

        // --- 4. BỘ PHÁT ÂM TIẾNG VIỆT CHỐNG TREO TRÊN IOS ---
        function speakText(text, callback) {
            if (!text || !text.trim()) {
                if (callback) callback();
                return;
            }

            clearTimeout(speakTimeout);
            isTalking = true;
            setRobotState("SPEAKING");

            try { window.speechSynthesis.cancel(); } catch(e) {}

            const cleanText = text.replace(/[*#_\-~]/g, "").trim();
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = "vi-VN";
            utter.rate = 1.0;
            utter.pitch = 1.1;

            let hasFinished = false;
            const finishSpeaking = () => {
                if (hasFinished) return;
                hasFinished = true;
                clearTimeout(speakTimeout);
                isTalking = false;
                setRobotState("NORMAL");
                if (callback) callback();
                setTimeout(() => {
                    startListening();
                }, 300);
            };

            utter.onend = finishSpeaking;
            utter.onerror = finishSpeaking;

            // Bộ đếm an toàn: Sau thời gian ước lượng (dựa trên độ dài câu) + 1.5s, tự ngắt nếu iOS bị treo sự kiện
            const estimatedDuration = Math.max(2000, (cleanText.length * 120));
            speakTimeout = setTimeout(finishSpeaking, estimatedDuration);

            try {
                window.speechSynthesis.speak(utter);
            } catch(e) {
                finishSpeaking();
            }
        }

       // --- 5. GỌI GEMINI REST API TỐC ĐỘ CAO (DƯỚI 1 GIÂY) ---
        async function askGemini(promptText) {
            let rawKey = apiKey || localStorage.getItem("gemini_api_key") || "";
            const currentKey = rawKey.replace(/[\r\n\t ]+/g, "").trim();
            
            if (!currentKey) {
                return "Bố bấm nút Cài đặt API Key ở góc trên để dán mã khóa vào giúp con nhé!";
            }

            const now = new Date();
            const timeStr = `${now.getHours()} giờ ${now.getMinutes()} phút`;
            const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            const dateStr = `${days[now.getDay()]}, ngày ${now.getDate()} tháng ${now.getMonth() + 1} năm ${now.getFullYear()}`;

            const promptHeThong = `Bạn là bé Tiến Anh, 9 tuổi, con của bố Quang và mẹ Thuận. Nhà có anh sinh đôi Duy Anh. Bạn học lớp 4 trường Phú Hòa 3. Bây giờ là ${timeStr}, ${dateStr}. Luôn xưng con gọi bố Quang. Trả lời cực ngắn dưới 20 từ, tự nhiên, không ký hiệu.`;

            // Ưu tiên trực tiếp model chạy ổn định và nhanh nhất hiện tại
            const targetModel = "gemini-2.5-flash-lite";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${currentKey}`;

            // Tạo controller để ngắt nếu quá 4 giây
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            try {
                const response = await fetch(url, {
                    method: "POST",
                    signal: controller.signal,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: promptHeThong }] },
                        contents: [{ role: "user", parts: [{ text: promptText }] }],
                        generationConfig: {
                            temperature: 0.5,
                            maxOutputTokens: 40 // Giảm số lượng token sinh ra để API phản hồi tức thì
                        }
                    })
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                        return data.candidates[0].content.parts[0].text.replace(/[*#_\-~]/g, "").trim();
                    }
                }
            } catch (err) {
                clearTimeout(timeoutId);
            }

            return "Con nghe chưa rõ lắm, bố nói lại cho con nghe với nha!";
        }

        // --- 6. NHẬN DIỆN GIỌNG NÓI AN TOÀN TRÊN SAFARI ---
        function startListening() {
            if (isTalking || isThinking) return;

            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            try {
                if (recognition) {
                    recognition.onend = null;
                    recognition.abort();
                }
            } catch(e) {}

            try {
                recognition = new SpeechRec();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = "vi-VN";

                let tempTranscript = "";

                recognition.onstart = () => {
                    setRobotState("NORMAL");
                };

                recognition.onresult = (event) => {
                    if (isTalking || isThinking) return;

                    let str = "";
                    for (let i = 0; i < event.results.length; ++i) {
                        str += event.results[i][0].transcript;
                    }
                    tempTranscript = str.trim();

                    if (tempTranscript) {
                        userSub.innerText = `Bố nói: "${tempTranscript}"`;

                        clearTimeout(silenceTimer);
                        silenceTimer = setTimeout(async () => {
                            if (isThinking || isTalking) return;
                            isThinking = true;

                            const query = tempTranscript;
                            try { recognition.abort(); } catch(e) {}

                            setRobotState("THINKING");
                            const answer = await askGemini(query);
                            botSub.innerText = `Tiến Anh: "${answer}"`;
                            
                            isThinking = false;
                            speakText(answer);
                        }, 750);
                    }
                };

                recognition.onerror = (e) => {
                    if (e.error === "no-speech" && !isTalking && !isThinking) {
                        setTimeout(() => startListening(), 250);
                    }
                };

                recognition.onend = () => {
                    if (!isTalking && !isThinking) {
                        setTimeout(() => startListening(), 250);
                    }
                };

                recognition.start();
            } catch(err) {
                console.warn("Lỗi khởi chạy mic:", err);
            }
        }

        // --- 7. SỰ KIỆN CLICK MỞ KHÓA TOÀN BỘ HỆ THỐNG ÂM THANH TRÊN IOS ---
        btnStart.onclick = function() {
            startOverlay.style.display = "none";

            // 1. Mở khóa AudioContext và SpeechSynthesis tức thì
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctxAudio = new AudioCtx();
                    ctxAudio.resume();
                }
            } catch(e) {}

            // 2. Chạy câu chào
            const greeting = "Con chào bố Quang, con nghe rõ rồi ạ!";
            botSub.innerText = `Tiến Anh: "${greeting}"`;
            speakText(greeting, () => {
                startListening();
            });
        };

        // Chạm vào màn hình để kích hoạt nghe ngay lập tức nếu Safari đưa tab vào trạng thái ngủ
        mainArea.onclick = function() {
            if (startOverlay.style.display === "none" && !isTalking && !isThinking) {
                startListening();
            }
        };

        btnConfig.onclick = function(e) {
            e.stopPropagation();
            const current = apiKey || "";
            const key = prompt("Nhập mã Gemini API Key của bạn:", current);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem("gemini_api_key", apiKey);
                alert("Đã lưu API Key thành công!");
            }
        };
    </script>
</body>
</html>
